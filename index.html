<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Contact Us</h1>
    <p class="subtitle">We'd love to hear from you. Fill out the form below.</p>

    <form id="contactForm" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name">
        <span class="error-message" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="you@example.com">
        <span class="error-message" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
        <span class="error-message" id="messageError"></span>
      </div>

      <button type="submit" id="submitBtn">Send Message</button>

      <div id="successMessage" class="success-message"></div>
    </form>
  </div>

<script src="script.js"></script>
</body>
</html>
